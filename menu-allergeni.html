<!DOCTYPE html>
<!-- v 2026.08.26.01 — RECUPERO DATI: la tabella allergeni della carta (Antipasti/Amidi e Carboidrati/Non Solo Mare) era stata sostituita per errore dai soli allergeni dei dolci ("Golosità") nel commit GitHub 98c285c del 8/8/2026 (root cause rintracciata confrontando lo storico commit del file: ultimo buono 8903505, stesso giorno, poche ore prima). Ripristinati i 13 piatti/allergeni dell'ultima versione buona (sezione "Antipasti" rinominata "Sfiziosi" per allinearsi al nome attuale della sezione in menu.html — solo il titolo, nessun dato allergeni toccato). ATTENZIONE Andrea: 4 piatti sono cambiati sul menù dal 8/8 a oggi e i loro allergeni NON sono stati riverificati da Claude (dato non disponibile) — vedi nota a parte in chat. -->

<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Allergeni — Santamonica</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root {
--cream: #faf7f2;
--ink: #1a1714;
--stone: #8c7e6e;
--rust: #9e4a2a;
--rule: #d4c9b8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
background: var(--cream);
color: var(--ink);
font-family: 'Cormorant Garamond', Georgia, serif;
font-weight: 400;
}

/* ── ctrl bar ── */
.ctrl-bar {
text-align: center;
padding: .9rem 1rem;
position: sticky;
top: 0;
z-index: 10;
background: var(--cream);
border-bottom: 1px solid var(--rule);
display: flex;
gap: .7rem;
justify-content: center;
align-items: center;
flex-wrap: wrap;
}
.ctrl-btn {
padding: .4rem 1.3rem;
background: transparent;
border: 1px solid var(--ink);
font-family: 'Jost', sans-serif;
font-size: .68rem;
letter-spacing: .16em;
text-transform: uppercase;
cursor: pointer;
color: var(--ink);
transition: background .2s, color .2s;
}
.ctrl-btn:hover {
background: var(--ink);
color: var(--cream);
}

/* ── pagina A4 ── */
.pg {
width: 210mm;
min-height: 297mm;
margin: 2rem auto;
padding: 16mm 22mm 14mm;
background: #fff;
box-shadow: 0 2px 24px rgba(0,0,0,.10);
display: flex;
flex-direction: column;
}

/* ── intestazione ── */
.pg-header {
text-align: center;
margin-bottom: 8mm;
}
.pg-header-title {
font-size: 1.9rem;
font-weight: 600;
letter-spacing: .22em;
text-transform: uppercase;
line-height: 1;
}
.pg-header-sub {
margin-top: .4rem;
font-family: 'Jost', sans-serif;
font-size: .65rem;
letter-spacing: .2em;
text-transform: uppercase;
color: var(--stone);
}

/* ── nota legale ── */
.nota-legale {
font-style: italic;
font-size: .72rem;
color: var(--stone);
text-align: center;
line-height: 1.6;
margin-bottom: 7mm;
padding-bottom: 5mm;
border-bottom: 1px solid var(--rule);
}

/* ── sezioni ── */
.sezione {
margin-bottom: 7mm;
}
.sezione-titolo {
font-size: 1.1rem;
font-weight: 600;
letter-spacing: .14em;
text-transform: uppercase;
margin-bottom: 3mm;
padding-bottom: 1.5mm;
border-bottom: 1px solid var(--rule);
}

/* ── piatto ── */
.piatto-row {
display: flex;
align-items: baseline;
padding: 2mm 0;
border-bottom: 1px dotted var(--rule);
gap: 4mm;
}
.piatto-row:last-child {
border-bottom: none;
}
.piatto-nome {
font-size: .9rem;
font-weight: 400;
flex: 0 0 38%;
line-height: 1.3;
}
.piatto-allergeni {
font-style: italic;
font-size: .82rem;
color: var(--ink);
flex: 1;
line-height: 1.4;
}
.piatto-allergeni-vuoti {
font-style: italic;
font-size: .78rem;
color: var(--stone);
}

/* ── legenda in fondo ── */
.legenda {
margin-top: auto;
padding-top: 5mm;
border-top: 1px solid var(--rule);
font-size: .67rem;
color: var(--stone);
font-style: italic;
line-height: 1.65;
text-align: center;
}
.legenda strong {
font-style: normal;
font-weight: 600;
color: var(--ink);
}

/* ── stampa ── */
@media print {
@page { size: A4 portrait; margin: 0; }
body { background: white; }
.ctrl-bar { display: none; }
.pg {
width: 210mm;
height: 297mm;
min-height: unset;
margin: 0;
padding: 14mm 20mm 12mm;
box-shadow: none;
page-break-after: always;
}
.pg:last-child { page-break-after: avoid; }
}
</style>
<style>
@media (max-width:640px){
.pg{width:auto!important;max-width:100%!important;min-height:0!important;margin:0!important;padding:20px 16px!important;box-shadow:none!important;}
.pg-header-title{font-size:1.5rem!important;letter-spacing:.14em!important;}
.sezione-titolo{font-size:.95rem!important;}
.piatto-row{flex-wrap:wrap!important;padding:2.5mm 0!important;}
.piatto-nome{flex:1 1 100%!important;}
.piatto-allergeni,.piatto-allergeni-vuoti{flex:1 1 100%!important;margin-top:.5mm!important;}
html,body{overflow-x:hidden!important;}
}
</style>
</head>
<body>

<div class="ctrl-bar">
<button class="ctrl-btn" onclick="window.print()">✦ Stampa / Salva PDF</button>
</div>

<div id="layout-allergeni"></div>

<script>
/* ═══════════════════════════════════════════════════════
ALLERGENI — modifica solo qui per aggiornare tutto
═══════════════════════════════════════════════════════ */
const ALLERGENI_DATA = {
  "sezioni": [
    {
      "titolo": "Antipasti",
      "piatti": [
        {
          "nome": "Dentice reale nostrano crudo, ricci di mare, limone, mandorle",
          "allergeni": [
            "glutine",
            "pesce",
            "frutta a guscio"
          ]
        },
        {
          "nome": "Gamberi viola crudi alla puttanesca",
          "allergeni": [
            "crostacei"
          ]
        },
        {
          "nome": "Calamaro nostrano, bagna cauda, kefir",
          "allergeni": [
            "pesce",
            "latte",
            "solfiti",
            "molluschi"
          ]
        },
        {
          "nome": "Animella di vitello, sedano rapa, nocciole, riduzione di fondo di pesce",
          "allergeni": [
            "pesce",
            "frutta a guscio",
            "solfiti"
          ]
        },
        {
          "nome": "“Non formaggi”",
          "allergeni": [
            "frutta a guscio",
            "solfiti"
          ]
        }
      ]
    },
    {
      "titolo": "Amidi e Carboidrati",
      "piatti": [
        {
          "nome": "Spaghettoni quadrati Mancini, anemoni di mare, nduja, maggiorana",
          "allergeni": [
            "glutine",
            "latte"
          ]
        },
        {
          "nome": "Cappellacci di cinghiale, cardoncelli, rucola, mirtilli",
          "allergeni": [
            "glutine",
            "uova",
            "pesce",
            "sedano",
            "solfiti"
          ]
        },
        {
          "nome": "Tubetti Mancini, baccalà, spinaci, kosho di agrumi",
          "allergeni": [
            "glutine",
            "pesce",
            "soia",
            "latte"
          ]
        },
        {
          "nome": "Riso Riserva San Massimo, ostriche, nespole, albicocche",
          "allergeni": [
            "glutine",
            "pesce",
            "soia",
            "latte",
            "molluschi"
          ]
        }
      ]
    },
    {
      "titolo": "Non Solo Mare",
      "piatti": [
        {
          "nome": "Ricciola nostrana, ciliege, levistico, tahina",
          "allergeni": [
            "pesce",
            "sesamo",
            "solfiti"
          ]
        },
        {
          "nome": "Porro arrosto, noci macadamia, fondo di verdure e pesche",
          "allergeni": [
            "frutta a guscio",
            "solfiti"
          ]
        },
        {
          "nome": "Ombrina nostrana, scarola, foglie di fico",
          "allergeni": [
            "uova",
            "pesce",
            "latte",
            "frutta a guscio",
            "solfiti"
          ]
        },
        {
          "nome": "\"Tournedos alla Rossini\"?",
          "allergeni": [
            "crostacei",
            "pesce",
            "latte",
            "sedano",
            "solfiti",
            "molluschi"
          ]
        }
      ]
    }
  ]
};
/* ═════════════════════════════════════════════════════════ */

const TUTTI_ALLERGENI = [
"glutine","crostacei","uova","pesce","arachidi",
"soia","latticini","frutta a guscio","sedano",
"senape","sesamo","solfiti","lupini","molluschi"
];

function render() {
var root = document.getElementById('layout-allergeni');
root.innerHTML = '';

var pg = document.createElement('div');
pg.className = 'pg';

// Intestazione
pg.innerHTML = '<div class="pg-header">' +
'<div class="pg-header-title">Allergeni</div>' +
'</div>';

// Sezioni
ALLERGENI_DATA.sezioni.forEach(function(sez) {
var sezDiv = document.createElement('div');
sezDiv.className = 'sezione';

var titolo = document.createElement('div');
titolo.className = 'sezione-titolo';
titolo.textContent = sez.titolo;
sezDiv.appendChild(titolo);

sez.piatti.forEach(function(piatto) {
var row = document.createElement('div');
row.className = 'piatto-row';

var nome = document.createElement('div');
nome.className = 'piatto-nome';
nome.innerHTML = piatto.nome;

var all = document.createElement('div');
if (piatto.allergeni && piatto.allergeni.length > 0) {
all.className = 'piatto-allergeni';
all.textContent = piatto.allergeni.join(', ');
} else {
all.className = 'piatto-allergeni-vuoti';
all.textContent = 'nessun allergene dichiarato';
}

row.appendChild(nome);
row.appendChild(all);
sezDiv.appendChild(row);
});

pg.appendChild(sezDiv);
});

// Legenda allergeni
var legenda = document.createElement('div');
legenda.className = 'legenda';
legenda.innerHTML = '<strong>Informativa ai sensi del Reg. UE 1169/2011. Per ulteriori informazioni sugli allergeni presenti nei nostri piatti si prega di rivolgersi al personale di sala.</strong><br>' +
TUTTI_ALLERGENI.join(' &bull; ');
pg.appendChild(legenda);

root.appendChild(pg);
}

render();

/* versione v 2026.08.26.01 */
</script>
</body>
</html>
