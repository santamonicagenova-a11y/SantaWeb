<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://santamonicagenova.it/menu-it">
  <title>Menù — Santamonica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --cream: #faf7f2;
      --ink:   #1a1714;
      --stone: #8c7e6e;
      --rust:  #9e4a2a;
      --rule:  #d4c9b8;
    }
    @media (max-width:640px){.pg{width:auto!important;max-width:100%!important;min-height:0!important;margin:0!important;padding:26px 16px!important;box-shadow:none!important;}.logo{font-size:1.9rem!important;letter-spacing:.1em!important;}.logo-sub{font-size:.6rem!important;}.lista-titolo{font-size:1.05rem!important;letter-spacing:.12em!important;}.sez-titolo{font-size:1.3rem!important;letter-spacing:.08em!important;}.sommelier{font-size:.62rem!important;}html,body{overflow-x:hidden!important;}}

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
    }

    /* ══════════════════════════════════════
       BARRA CONTROLLI
    ══════════════════════════════════════ */
    .ctrl-bar {
      text-align: center;
      padding: .9rem 1rem;
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--cream);
      border-bottom: 1px solid var(--rule);
      display: flex;
      gap: .7rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      padding: .4rem 1.3rem;
      background: transparent;
      border: 1px solid var(--ink);
      font-family: 'Jost', sans-serif;
      font-size: .68rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--ink);
      transition: background .2s, color .2s;
    }
    .ctrl-btn:hover, .ctrl-btn.active {
      background: var(--ink);
      color: var(--cream);
    }
    .ctrl-sep {
      width: 1px;
      height: 1.4rem;
      background: var(--rule);
    }
    .sz-val {
      font-family: 'Jost', sans-serif;
      font-size: .62rem;
      color: var(--stone);
      min-width: 2.4em;
      display: inline-block;
      text-align: center;
    }

    .stampa-hint {
      text-align: center;
      font-family: 'Jost', sans-serif;
      font-size: .68rem;
      color: var(--stone);
      padding: .4rem 1rem .8rem;
      background: var(--cream);
      border-bottom: 1px solid var(--rule);
    }

    /* ══════════════════════════════════════
       PAGINA  (shared)
    ══════════════════════════════════════ */
    .pg {
      width: 210mm;
      min-height: 297mm;
      margin: 2rem auto;
      padding: 18mm 24mm 16mm;
      background: #fff;
      box-shadow: 0 2px 24px rgba(0,0,0,.10);
      display: flex;
      flex-direction: column;
    }

    /* ══════════════════════════════════════
       LAYOUT: MENÙ ALLA CARTA
    ══════════════════════════════════════ */
    #layout-carta { display: block; }
    #layout-orario { display: none; }

    /* ── intestazione ── */
    .pg-header {
      text-align: center;
      margin-bottom: 9mm;
      padding-bottom: 5mm;
      border-bottom: 1px solid var(--rule);
    }
    .logo {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: .22em;
      text-transform: uppercase;
      line-height: 1;
    }
    .logo em { font-style: italic; color: var(--stone); }
    .logo-sub {
      margin-top: .45rem;
      font-family: 'Jost', sans-serif;
      font-size: .67rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--stone);
    }

    /* ── degustazione ── */
    .degu {
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4mm 0;
      transform: translateY(var(--shift, 0));
    }
    .degu-titolo {
      margin-top: 0;
      font-size: calc(1.4rem * var(--fs, 1.12));
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-bottom: 5mm;
    }
    .degu-prezzi {
      font-style: italic;
      font-size: calc(.98rem * var(--fs, 1.12));
      line-height: calc(1.4 * var(--lh, 1));
      margin-bottom: 2mm;
    }
    .degu-nota {
      font-style: italic;
      font-size: calc(.98rem * var(--fs, 1.12));
      color: var(--ink);
      margin-bottom: 14mm;
    }
    .degu-nota strong {
      font-style: normal;
      font-weight: 400;
      text-decoration: underline;
      text-underline-offset: 2px;
      color: var(--ink);
    }
    .percorso { margin-bottom: calc(12mm * var(--gap, 1)); }
    .percorso-label {
      font-style: italic;
      font-weight: 700;
      font-size: calc(1.25rem * var(--fs, 1.12));
      margin-bottom: 3mm;
    }
    .percorso-piatto { font-size: calc(.96rem * var(--fs, 1.12)); line-height: calc(1.95 * var(--lh, 1)); font-style: normal; }
    .percorso-libero { font-size: calc(.96rem * var(--fs, 1.12)); line-height: calc(1.95 * var(--lh, 1)); font-style: normal; }

    /* ── sezioni carta ── */
    .pg-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transform: translateY(var(--shift, 0));
    }
    .sezione { margin-bottom: calc(14mm * var(--gap, 1)); }
    .sezione-titolo {
      font-family: 'Cormorant Garamond', serif;
      font-style: normal;
      font-size: calc(1.5rem * var(--fs, 1.12));
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 5mm;
      padding-bottom: 2mm;
    }

    /* ── piatti carta ── */
    .piatto {
      text-align: center;
      padding: calc(.5mm * var(--gap, 1)) 0;
      font-size: calc(.96rem * var(--fs, 1.12));
      line-height: calc(1.4 * var(--lh, 1));
    }
    .piatto-prezzo {
      font-size: calc(.8rem * var(--fs, 1.12));
      color: var(--stone);
      margin-left: .3rem;
    }
    .piatto-unita {
      font-size: calc(.76rem * var(--fs, 1.12));
      color: var(--stone);
      margin-left: .1rem;
    }
    .piatto-desc {
      font-style: italic;
      font-size: 0.7em;
      line-height: calc(1.25 * var(--lh, 1));
      color: var(--stone);
      display: block;
      margin-top: 0.3mm;
    }
    .percorso-desc {
      font-style: italic;
      font-size: 0.7em;
      line-height: calc(1.25 * var(--lh, 1));
      color: var(--stone);
      display: block;
      margin-top: 0.3mm;
    }
    .piatto-staccato { margin-top: calc(3.5mm * var(--gap, 1)); }

    .eco::after {
      content: ' *';
      color: var(--rust);
      font-size: .76em;
    }

    /* ── note ospite carta ── */
    .note-ospite {
      margin-top: auto;
      font-style: italic;
      font-size: .73rem;
      color: var(--stone);
      text-align: center;
      line-height: 1.65;
      padding-top: 5mm;
      border-top: 1px solid var(--rule);
    }
    .note-ospite-titolo {
      text-decoration: underline;
      display: block;
      margin-bottom: 1.2mm;
    }
    .note-ospite u { text-decoration: underline; }

    /* ══════════════════════════════════════
       LAYOUT: FOGLIO ORARIO (1 pagina, 2 col)
    ══════════════════════════════════════ */
    .pg-orario {
      padding: 6mm 8mm 8mm;
    }

    .orario-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.8rem;
      font-style: italic;
      font-weight: 300;
      letter-spacing: .08em;
      text-align: center;
      margin-bottom: 5mm;
      line-height: 1;
    }

    .orario-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: 1.5px solid var(--ink);
      flex: 1;
    }

    .orario-col {
      padding: 6mm 8mm;
      display: flex;
      flex-direction: column;
      gap: 6mm;
    }

    .orario-col:first-child {
      border-right: 1.5px solid var(--ink);
    }

    /* separatore tratteggiato interno (dopo ostriche) */
    .orario-sep {
      border: none;
      border-top: 1px dashed var(--stone);
      margin: 1mm 0;
    }

    .orario-sez { text-align: center; }

    .orario-sez-titolo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 3mm;
    }

    .orario-piatto {
      font-size: 1.2rem;
      line-height: 1.35;
      text-align: center;
      margin-bottom: .55rem;
    }
    .orario-piatto:last-child { margin-bottom: 0; } .orario-desc { display: block; font-style: italic; font-size: .735em; line-height: 1.25; color: var(--stone); margin-top: .3mm; }

    .orario-piatto .eco::after {
      content: ' *';
      color: var(--rust);
      font-size: .76em;
    }

    /* ── sezione orario in basso ── */
    .orario-footer-col {
      display: flex;
      flex-direction: column;
      gap: 4mm;
    }

    .orario-links {
      font-family: 'Cormorant Garamond', serif;
      font-style: normal;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      line-height: 2.1;
      text-align: center;
    }
    .orario-links u { text-decoration: none; }

    .orario-qr {
      width: 45mm;
      height: 45mm;
      display: block;
      margin: 0 auto;
    }

    .orario-servizio {
      font-style: italic;
      font-size: 1rem;
      line-height: 1.85;
      text-align: center;
    }
    .orario-servizio-titolo {
      text-decoration: underline;
      font-style: italic;
      display: block;
      margin-bottom: 2mm;
    }

    .orario-nota {
      font-size: .72rem;
      color: var(--stone);
      line-height: 1.6;
      text-align: center;
      border-top: 1px solid var(--rule);
      padding-top: 3mm;
      margin-top: auto;
    }

    /* ══════════════════════════════════════
       STAMPA
    ══════════════════════════════════════ */
    @media print {
      @page { size: A4 portrait; margin: 8mm; }
      @page orarioPage { size: A4 portrait; margin: 3mm 5mm; } /* v 2026.07.28.01: era margin:0 (full-bleed) - costringeva la stampante a inventarsi un margine reale, spesso asimmetrico sn/dx (stessa causa gia' isolata sul @page principale il 5/7). Ora la banda di sicurezza e' dichiarata qui invece che nel padding interno di .pg-orario: stesso spazio totale (3mm/5mm), nessun rischio overflow */
      html { font-size: 20px; } /* v 2026.09.29.03: nome piatto 18pt, descrizione 15pt (=.8333em) in stampa; A+/A- scalano in proporzione */ #layout-carta .piatto { font-size: calc(18pt * var(--fs, .97) / .97); } #layout-carta .piatto-desc { font-size: .8333em; } /* +25% leggibilita\u0301 stampa (v 2026.05.14.03) */
      body { background: white; }
      .ctrl-bar { display: none; }
      .stampa-hint { display: none; }
      .percorso.no-print { display: none; }

      /* carta: 3 pagine */
      #layout-carta .pg {
        width: auto;
        height: 280mm; /* 1mm di scorta sull'area stampabile (281mm): mai una pagina vuota per arrotondamento */
        min-height: unset;
        margin: 0;
        padding: 9mm 14mm 0; /* v 2026.10.02.01: note ospite attaccate in basso, vedi sotto */
        box-shadow: none;
        page-break-after: always;
      }
      #layout-carta .pg:last-child { page-break-after: avoid; }
      #layout-carta .note-ospite { margin-top: auto; padding-bottom: calc(max(var(--note-bottom, 6), 0) * 1mm); transform: translateY(calc(max(-1 * var(--note-bottom, 6), 0) * 1mm)); } /* sempre sul fondo pagina, una riga di stacco dal bordo */

      /* orario: 1 pagina */
      #layout-orario .pg {
        page: orarioPage;
        width: 200mm;
        height: 291mm;
        min-height: unset;
        margin: 0;
        box-shadow: none;
        page-break-after: avoid;
      }

      /* ----- v 2026.05.17.02: scaling dedicato orario per evitare trabocco A4 (riduzione aggressiva) ----- */
      /* v 2026.07.28.01: padding spostato nel margine di @page orarioPage (vedi sopra), qui azzerato per non raddoppiare l'inset */
      #layout-orario .pg-orario { padding: 0; }
      #layout-orario .orario-logo { font-size: 2.9rem; margin-bottom: 3mm; }
      #layout-orario .orario-col { padding: 3mm 5mm; gap: 3mm; }
      #layout-orario .orario-sez-titolo { font-size: 1.18rem; margin-bottom: 2mm; }
      #layout-orario .orario-desc { font-size: 13pt; line-height: 1.2; } #layout-orario .orario-piatto { font-size: .9rem; line-height: 1.25; margin-bottom: .4rem; }
      #layout-orario .orario-links { font-size: .85rem; line-height: 1.75; }
      #layout-orario .orario-qr { width: 35mm; height: 35mm; }
      #layout-orario .orario-servizio { font-size: .82rem; line-height: 1.65; }
      #layout-orario .orario-nota { font-size: .56rem; padding-top: 2mm; line-height: 1.45; }
    }
    /* v 2026.10.02.03: dimensioni per tipologia (MENU.tipoScale -> --k-*), pt riferiti alla stampa */
    #layout-carta .sezione-titolo { font-size: calc(1.5rem * var(--fs, 1.12) * var(--k-tit, 1)); }
    #layout-carta .piatto, #layout-carta .percorso-piatto, #layout-carta .percorso-libero { font-size: calc(.96rem * var(--fs, 1.12) * var(--k-piatto, 1)); }
    #layout-carta .piatto-desc, #layout-carta .percorso-desc { font-size: calc(.672rem * var(--fs, 1.12) * var(--k-desc, 1)); }
    #layout-carta .piatto-prezzo { font-size: calc(.8rem * var(--fs, 1.12) * var(--k-prezzo, 1)); }
    #layout-carta .piatto-unita { font-size: calc(.76rem * var(--fs, 1.12) * var(--k-prezzo, 1)); }
    #layout-carta .degu-titolo { font-size: calc(1.4rem * var(--fs, 1.12) * var(--k-degu, 1)); }
    #layout-carta .degu-prezzi, #layout-carta .degu-nota { font-size: calc(.98rem * var(--fs, 1.12) * var(--k-degu, 1)); }
    #layout-carta .percorso-label { font-size: calc(1.25rem * var(--fs, 1.12) * var(--k-degu, 1)); }
    #layout-carta .note-ospite { font-size: calc(.73rem * var(--k-note, 1)); }
    .tipo-grp { display: inline-flex; align-items: center; gap: .3rem; }
    .tipo-lbl { font-family: 'Jost', sans-serif; font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--stone); }
    .tipo-grp .ctrl-btn { padding: .25rem .7rem; }
    .tipo-grp .sz-val { min-width: 4.2em; color: var(--ink); font-weight: 500; }
    @media print {
      #layout-carta .piatto { font-size: calc(18pt * var(--fs, .97) / .97 * var(--k-piatto, 1)); }
      #layout-carta .piatto-desc { font-size: calc(15pt * var(--fs, .97) / .97 * var(--k-desc, 1)); }
    }
  </style>
</head>
<body>
<div class="ctrl-bar">
  <button class="ctrl-btn active" id="btn-carta" onclick="showLayout('carta')">☞ Menù alla carta (3 pag.)</button>
  <div class="ctrl-sep"></div>
  <button class="ctrl-btn" id="btn-orario" onclick="showLayout('orario')">☞ Foglio orario (1 pag.)</button>
  <div class="ctrl-sep"></div>
  <button class="ctrl-btn" onclick="window.print()">⚡ Stampa</button>
  <div class="ctrl-sep"></div>
  <button class="ctrl-btn" onclick="_szF(0.03)" title="Caratteri piu grandi">A+</button>
  <button class="ctrl-btn" onclick="_szF(-0.03)" title="Caratteri piu piccoli">A−</button>
  <span class="sz-val" id="szValFs"></span>
  <button class="ctrl-btn" onclick="_szL(0.05)" title="Interlinea +">↕+</button>
  <button class="ctrl-btn" onclick="_szL(-0.05)" title="Interlinea −">↕−</button>
  <span class="sz-val" id="szValLh"></span>
  <button class="ctrl-btn" onclick="_szG(0.05)" title="Spazio +">¶+</button>
  <button class="ctrl-btn" onclick="_szG(-0.05)" title="Spazio −">¶−</button>
  <span class="sz-val" id="szValGap"></span>
  <button class="ctrl-btn" onclick="_szS(2)" title="Sposta giu">⬇</button>
  <button class="ctrl-btn" onclick="_szS(-2)" title="Sposta su">⬆</button>
  <span class="sz-val" id="szValShift"></span>
  <button class="ctrl-btn" onclick="_szR()" title="Ripristina dimensioni">↺</button>
  <button class="ctrl-btn" onclick="_szSave()" title="Fissa i valori attuali come predefiniti per questo menù">✔ Fissa come default</button>
  <div style="flex-basis:100%;height:0"></div>
  <span class="tipo-grp"><span class="tipo-lbl">Titoli sezione</span><button class="ctrl-btn" onclick="_szT('tit',-0.5)" title="Titoli sezione più piccolo">−</button><span class="sz-val" id="szT-tit"></span><button class="ctrl-btn" onclick="_szT('tit',0.5)" title="Titoli sezione più grande">+</button></span>
  <span class="tipo-grp"><span class="tipo-lbl">Nome piatto</span><button class="ctrl-btn" onclick="_szT('piatto',-0.5)" title="Nome piatto più piccolo">−</button><span class="sz-val" id="szT-piatto"></span><button class="ctrl-btn" onclick="_szT('piatto',0.5)" title="Nome piatto più grande">+</button></span>
  <span class="tipo-grp"><span class="tipo-lbl">Descrizione</span><button class="ctrl-btn" onclick="_szT('desc',-0.5)" title="Descrizione più piccolo">−</button><span class="sz-val" id="szT-desc"></span><button class="ctrl-btn" onclick="_szT('desc',0.5)" title="Descrizione più grande">+</button></span>
  <span class="tipo-grp"><span class="tipo-lbl">Prezzo</span><button class="ctrl-btn" onclick="_szT('prezzo',-0.5)" title="Prezzo più piccolo">−</button><span class="sz-val" id="szT-prezzo"></span><button class="ctrl-btn" onclick="_szT('prezzo',0.5)" title="Prezzo più grande">+</button></span>
  <span class="tipo-grp"><span class="tipo-lbl">Degustazione</span><button class="ctrl-btn" onclick="_szT('degu',-0.5)" title="Degustazione più piccolo">−</button><span class="sz-val" id="szT-degu"></span><button class="ctrl-btn" onclick="_szT('degu',0.5)" title="Degustazione più grande">+</button></span>
  <span class="tipo-grp"><span class="tipo-lbl">Note ospite</span><button class="ctrl-btn" onclick="_szT('note',-0.5)" title="Note ospite più piccolo">−</button><span class="sz-val" id="szT-note"></span><button class="ctrl-btn" onclick="_szT('note',0.5)" title="Note ospite più grande">+</button></span>
  <span class="tipo-grp"><span class="tipo-lbl">Note dal fondo</span><button class="ctrl-btn" onclick="_szN(-1)" title="Note più in basso">−</button><span class="sz-val" id="szNB"></span><button class="ctrl-btn" onclick="_szN(1)" title="Note più in alto">+</button></span>
  <span class="tipo-grp" id="szCheck" style="font-family:Jost,sans-serif;font-size:.7rem;margin-left:.6rem"></span>
</div>
<div class="stampa-hint">Per una stampa senza margini storti: Stampa → Salva come PDF → apri il PDF con Foxit Reader → Stampa con Scala personalizzata 97%.</div>



<div id="layout-carta"></div>
<div id="layout-orario"></div>

function getSez(titolo) {
  var found = MENU.sezioni.find(s => s.titolo === titolo);
  if (!found) {
    // Fallback: cerca per titolo_display o per indice
    var idx = ['Crudi','Sfiziosi','Amidi e Carboidrati','Non Solo Mare'].indexOf(titolo);
    if (idx >= 0 && MENU.sezioni[idx]) found = MENU.sezioni[idx];
  }
  return found;
}

function buildPiatto(p) {
  const eco = p.sostenibile ? ' eco' : '';
  const staccato = p.staccato ? ' piatto-staccato' : '';
  const unitaHtml = p.unita ? `<span class="piatto-unita">${p.unita}</span>` : '';
  const prezzoHtml = p.prezzo != null
    ? `<span class="piatto-prezzo">${p.prezzo}${unitaHtml}</span>` : '';
  const descHtml = p.descrizione
    ? `<span class="piatto-desc">${p.descrizione}</span>` : '';
  return `<div class="piatto${staccato}"><span class="piatto-riga${eco}">${p.nome}</span>${prezzoHtml}${descHtml}</div>`;
}

function buildSezione(s) {
  const label = s.titolo_display || s.titolo;
  return `
    <div class="sezione">
      <div class="sezione-titolo">${label}</div>
      ${s.piatti.map(buildPiatto).join('')}
    </div>`;
}

function buildDegu(degu) {
  let percorso6Vuoto = true, percorso7Vuoto = true;
  for (const piatti of Object.values(degu.percorsi)) {
    if (typeof piatti === 'string') { if (piatti.trim()) percorso7Vuoto = false; }
    else { if (piatti && piatti.length) percorso6Vuoto = false; }
  }
  const optsHtml = degu.opzioni.filter(o => {
    if (o.portate === 6) return !percorso6Vuoto;
    if (o.portate === 7) return !percorso7Vuoto;
    return true;
  }).map(o =>
    `${o.portate} portate &nbsp;${o.prezzo}, eventuale abbinamento vini ${o.vini}`
  ).join('<br>');

  let percorsiHtml = '';
  for (const [n, piatti] of Object.entries(degu.percorsi)) {
    const vuoto = typeof piatti === 'string' ? !piatti.trim() : !piatti.length;
    if (vuoto) continue;
    const escl = typeof piatti === 'string' ? !!degu.escludi_stampa_7 : !!degu.escludi_stampa_6;
    const printCls = escl ? ' no-print' : '';
    if (typeof piatti === 'string') {
      percorsiHtml += `
        <div class="percorso${printCls}">
          <div class="percorso-label">&ldquo;${n}&rdquo;</div>
          <div class="percorso-piatto percorso-libero">${piatti}</div>
        </div>`;
    } else {
      const righe = piatti.map(p => {
        const descHtml = p.descrizione ? `<span class="percorso-desc">${p.descrizione}</span>` : '';
        return `<div class="percorso-piatto${p.sostenibile ? ' eco' : ''}">${p.nome}${descHtml}</div>`;
      }).join('');
      percorsiHtml += `
        <div class="percorso${printCls}">
          <div class="percorso-label">&ldquo;${n}&rdquo;</div>
          ${righe}
        </div>`;
    }
  }

  return `
    <div class="degu">
      <h1 class="degu-titolo">Men&ugrave; Degustazione</h1>
      <div class="degu-prezzi">${optsHtml}</div>
      <div class="degu-nota">${degu.nota.replace("l'intero tavolo", "<strong>l\u2019intero tavolo</strong>")}</div>
      ${percorsiHtml}
    </div>`;
}

function renderCarta() {
  const root = document.getElementById('layout-carta');

function buildOrarioColonna(titoli, sepDopo) {
  return titoli.map(titolo => {
    const s = getSez(titolo);
    const piatti = s.piatti.map(p => {
      const eco = p.sostenibile ? ' eco' : '';
      const unitaHtml = p.unita ? ` ${p.unita}` : '';
      const prezzoHtml = p.prezzo != null ? ` ${p.prezzo}${unitaHtml}` : '';
      return `<div class="orario-piatto"><span class="${'piatto-riga' + eco}">${p.nome}${prezzoHtml}</span>${p.descrizione ? '<span class="orario-desc">' + p.descrizione + '</span>' : ''}</div>`;
    }).join('');

    const sep = (titolo === sepDopo) ? '<hr class="orario-sep">' : '';
    // ogni sezione in uno slot flex:1 centrato verticalmente
    return `
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;">
        <div class="orario-sez">
          <div class="orario-sez-titolo">${s.titolo_display || s.titolo}</div>
          ${piatti}
        </div>
      </div>${sep}`;
  }).join('');
}

function renderOrario() {
  const root = document.getElementById('layout-orario');
  root.innerHTML = '';
  const cfg = MENU.orario;

  const orarioHtml = cfg.orarioServizio.map(o =>

  ).join('');

  pg.className = 'pg pg-orario';

    <div class="orario-grid" style="flex:1">

        ${buildOrarioColonna(cfg.colSinistra, cfg.separatoreDopo)}
