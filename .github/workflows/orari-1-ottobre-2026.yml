# Cambio orari del 1/10/2026 (domenica solo pranzo, venerdì anche pranzo): pubblica in automatico
# FAQ orari + JSON-LD statico + foglio orario stampabile, come il pulsante "📤 Pubblica FAQ" di
# menu-admin → Orari di Apertura. Logica in scripts/orari-cambio-periodo.mjs, testi in
# scripts/orari-2026-10-01.json. Due passaggi (05:30 e 08:00 ora italiana) per sicurezza: il
# secondo non fa nulla se il primo è andato a buon fine. Fuori dalla finestra 1-8/10 lo script
# non fa nulla. Si può lanciare anche a mano da GitHub → Actions → "Run workflow".
name: Orari dal 1 ottobre 2026

on:
  schedule:
    - cron: '30 3 1 10 *'
    - cron: '0 6 1 10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-orari:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aggiorna FAQ, JSON-LD e foglio orario
        run: node scripts/orari-cambio-periodo.mjs scripts/orari-2026-10-01.json
      - name: Commit e push
        run: |
          if git diff --quiet; then echo "Nessuna modifica."; exit 0; fi
          git config user.name "santamonica-orari-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations.json index.html dove-siamo.html menu.html menu-it.html menu-en.html menu-fr.html
          git commit -m "Orari dal 1/10: FAQ + JSON-LD + foglio orario allineati al nuovo periodo (automatico)"
          git push
